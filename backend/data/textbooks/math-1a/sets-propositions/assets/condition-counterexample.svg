<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <rect width="1040" height="500" fill="#fff"/>

  <text x="260" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">命題が真になる形</text>
  <text x="260" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">結論 q を満たす範囲</text>
  <ellipse cx="260" cy="245" rx="175" ry="110" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <ellipse cx="260" cy="245" rx="85" ry="55" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
  <text x="260" y="238" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c">仮定 p を</text>
  <text x="260" y="264" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c">満たす範囲</text>

  <text x="780" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">反例がある形</text>
  <ellipse cx="735" cy="245" rx="150" ry="100" fill="#fff7ed" fill-opacity=".65" stroke="#ea580c" stroke-width="4"/>
  <ellipse cx="825" cy="245" rx="150" ry="100" fill="#eff6ff" fill-opacity=".65" stroke="#2563eb" stroke-width="4"/>
  <circle cx="655" cy="245" r="9" fill="#1f2937"/>
  <path d="M650 235 L620 178" stroke="#1f2937" stroke-width="2.5"/>
  <text x="590" y="166" font-size="21" font-weight="700" fill="#1f2937">反例</text>
  <text x="690" y="390" text-anchor="middle" font-size="18" fill="#ea580c">仮定 p を満たす範囲</text>
  <text x="875" y="420" text-anchor="middle" font-size="18" fill="#2563eb">結論 q を満たす範囲</text>

  <text x="520" y="472" text-anchor="middle" font-size="20" fill="#64748b">図形の境界とラベルを重ねず、範囲の関係を位置で読む</text>
</svg>