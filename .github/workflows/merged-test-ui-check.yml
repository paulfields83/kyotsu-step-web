name: Merged test UI validation
on:
  push:
    branches: ['合并版ui']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Install Chromium for integrated app test
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise revised math, sets and physics in Chromium
        env:
          VITE_API_BASE_URL: https://kyotsu-step-db-merged-preview.onrender.com
          E2E_BASE_URL: https://kyotsu-step-ui-merged-preview.onrender.com
        run: pnpm exec playwright test e2e/revised-live-integration.spec.ts --workers=1 --retries=0
