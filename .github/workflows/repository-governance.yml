name: Repository Governance Check

on:
  pull_request:
  push:
    branches:
      - main
      - chore/juku-repository-os-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check repository governance
        run: node tools/repo-governance-check.mjs
