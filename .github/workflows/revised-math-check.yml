name: Revised 数と式 backend validation
on:
  push:
    branches: ['合并版db']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-revised-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend contracts
        run: pnpm run typecheck
      - name: Typecheck and validate backend textbook schema
        run: pnpm --dir backend run check
      - name: Test full frontend/backend codebase
        run: pnpm run test
      - name: Production build
        run: pnpm run build
