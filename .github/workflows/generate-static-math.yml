name: Generate static math textbooks

on:
  push:
    branches:
      - refactor/textbook-backend-split

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[static-math-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/textbook-backend-split
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX reader
        run: pip install python-docx==1.2.0

      - name: Generate static backend textbooks
        run: python scripts/generate_math_textbooks_static.py

      - name: Commit generated backend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/textbooks/math-1a
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "data(backend): add remaining static math textbooks [static-math-generated]"
          git push origin HEAD:refactor/textbook-backend-split
