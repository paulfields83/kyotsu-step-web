<g stroke="currentColor" opacity=".12" stroke-width="1">
<line x1="90" y1="55" x2="90" y2="430"/><line x1="155" y1="55" x2="155" y2="430"/><line x1="220" y1="55" x2="220" y2="430"/><line x1="285" y1="55" x2="285" y2="430"/><line x1="350" y1="55" x2="350" y2="430"/><line x1="415" y1="55" x2="415" y2="430"/><line x1="480" y1="55" x2="480" y2="430"/><line x1="545" y1="55" x2="545" y2="430"/><line x1="610" y1="55" x2="610" y2="430"/>
<line x1="90" y1="430" x2="610" y2="430"/><line x1="90" y1="378" x2="610" y2="378"/><line x1="90" y1="326" x2="610" y2="326"/><line x1="90" y1="274" x2="610" y2="274"/><line x1="90" y1="222" x2="610" y2="222"/><line x1="90" y1="170" x2="610" y2="170"/><line x1="90" y1="118" x2="610" y2="118"/><line x1="90" y1="66" x2="610" y2="66"/>
</g>
<g fill="none" stroke="currentColor" stroke-width="3">
<line x1="90" y1="430" x2="630" y2="430"/><line x1="90" y1="430" x2="90" y2="45"/>
<line x1="155" y1="326" x2="545" y2="118" marker-end="url(#arrow)"/>
</g>
<g fill="currentColor" font-family="Arial, sans-serif" font-size="22">
<circle cx="155" cy="326" r="7"/><circle cx="545" cy="118" r="7"/>
<text x="170" y="330">P₁(1.0, 2.0)</text><text x="430" y="98">P₂(7.0, 6.0)</text>
<text x="642" y="438">x [m]</text><text x="42" y="58">y [m]</text><text x="335" y="205">Δr</text>
