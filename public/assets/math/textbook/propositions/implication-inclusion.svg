<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">PがQに含まれる図</title>
<desc id="desc">全体集合Uの中で集合Pが集合Qの内側に完全に含まれている図。</desc>
<rect x="20" y="20" width="600" height="320" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
<ellipse cx="330" cy="185" rx="205" ry="115" fill="none" stroke="#111" stroke-width="4"/>
<ellipse cx="300" cy="190" rx="92" ry="58" fill="#e9e9e9" stroke="#111" stroke-width="3"/>
<text x="55" y="65" font-family="sans-serif" font-size="30" fill="#111">U</text>
<text x="445" y="115" font-family="sans-serif" font-size="30" fill="#111">Q</text>
<text x="285" y="200" font-family="sans-serif" font-size="30" fill="#111">P</text>
</svg>