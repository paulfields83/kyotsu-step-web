<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">対角線の長さが等しい四角形ABCD</title>
  <desc id="desc">上辺ADが短く下辺BCが長い四角形。対角線ACとBDには同じ長さを表す印が付いている。</desc>
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M175 70 L340 70 L420 295 L95 295 Z"/>
    <path d="M175 70 L420 295"/>
    <path d="M340 70 L95 295"/>
    <path d="M238 127 l12 16 M247 120 l12 16"/>
    <path d="M282 120 l-12 16 M291 127 l-12 16"/>
  </g>
  <g fill="currentColor" font-family="sans-serif" font-size="30">
    <text x="155" y="58">A</text>
    <text x="345" y="58">D</text>
    <text x="67" y="330">B</text>
    <text x="430" y="330">C</text>
  </g>
</svg>