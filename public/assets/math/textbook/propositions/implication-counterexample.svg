<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">PがQに含まれない図</title>
<desc id="desc">全体集合Uの中で集合Pの一部が集合Qの外へ出ている図。</desc>
<rect x="20" y="20" width="600" height="320" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
<ellipse cx="270" cy="185" rx="150" ry="100" fill="none" stroke="#111" stroke-width="4"/>
<ellipse cx="400" cy="185" rx="150" ry="100" fill="none" stroke="#111" stroke-width="4"/>
<circle cx="175" cy="185" r="8" fill="#111"/>
<text x="55" y="65" font-family="sans-serif" font-size="30" fill="#111">U</text>
<text x="205" y="105" font-family="sans-serif" font-size="30" fill="#111">P</text>
<text x="435" y="105" font-family="sans-serif" font-size="30" fill="#111">Q</text>
<text x="155" y="220" font-family="sans-serif" font-size="24" fill="#111">反例</text>
</svg>