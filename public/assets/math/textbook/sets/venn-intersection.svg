<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">共通部分</title>
  <desc id="desc">集合Aと集合Bの重なりだけを灰色で示す図。</desc>
  <defs>
    <clipPath id="clipB"><circle cx="370" cy="180" r="110"/></clipPath>
  </defs>
  <rect x="20" y="20" width="600" height="320" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="270" cy="180" r="110" fill="#d9d9d9" clip-path="url(#clipB)"/>
  <circle cx="270" cy="180" r="110" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="370" cy="180" r="110" fill="none" stroke="#111" stroke-width="4"/>
  <text x="210" y="82" font-family="sans-serif" font-size="32" fill="#111">A</text>
  <text x="410" y="82" font-family="sans-serif" font-size="32" fill="#111">B</text>
  <text x="320" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#111">3, 5, 7</text>
</svg>