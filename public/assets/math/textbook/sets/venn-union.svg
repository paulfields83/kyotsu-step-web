<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">和集合 A∪B</title>
  <desc id="desc">集合AとBの2つの円全体を、重なりを含めて淡い灰色で塗ったベン図。</desc>
  <rect x="20" y="20" width="600" height="320" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="270" cy="180" r="110" fill="#d9d9d9"/>
  <circle cx="370" cy="180" r="110" fill="#d9d9d9"/>
  <circle cx="270" cy="180" r="110" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="370" cy="180" r="110" fill="none" stroke="#111" stroke-width="4"/>
  <text x="175" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="32" fill="#111">A</text>
  <text x="465" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="32" fill="#111">B</text>
</svg>