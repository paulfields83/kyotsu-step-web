<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">和集合</title>
  <desc id="desc">集合Aまたは集合Bに入る2つの円全体を灰色で示す図。</desc>
  <rect x="20" y="20" width="600" height="320" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="270" cy="180" r="110" fill="#d9d9d9" stroke="#111" stroke-width="4"/>
  <circle cx="370" cy="180" r="110" fill="#d9d9d9" stroke="#111" stroke-width="4"/>
  <text x="210" y="82" font-family="sans-serif" font-size="32" fill="#111">A</text>
  <text x="410" y="82" font-family="sans-serif" font-size="32" fill="#111">B</text>
</svg>