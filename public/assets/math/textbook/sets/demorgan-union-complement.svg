<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">和集合の補集合</title><desc id="desc">全体集合Uの中でAとBの2つの円の外側だけを灰色で示す図。</desc>
<defs><mask id="cutUnion"><rect width="640" height="360" fill="white"/><circle cx="270" cy="180" r="110" fill="black"/><circle cx="370" cy="180" r="110" fill="black"/></mask></defs>
<rect x="20" y="20" width="600" height="320" rx="18" fill="#d9d9d9" stroke="#111" stroke-width="3" mask="url(#cutUnion)"/>
<circle cx="270" cy="180" r="110" fill="none" stroke="#111" stroke-width="4"/>
<circle cx="370" cy="180" r="110" fill="none" stroke="#111" stroke-width="4"/>
<text x="55" y="65" font-family="sans-serif" font-size="30" fill="#111">U</text>
<text x="210" y="82" font-family="sans-serif" font-size="30" fill="#111">A</text>
<text x="410" y="82" font-family="sans-serif" font-size="30" fill="#111">B</text>
</svg>