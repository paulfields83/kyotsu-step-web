<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">部分集合の関係</title>
  <desc id="desc">集合Bが集合Aの内側に完全に含まれ、集合Cは一部がAの外側に出ていることを示す図。</desc>
  <rect x="20" y="20" width="600" height="320" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <ellipse cx="290" cy="185" rx="190" ry="115" fill="none" stroke="#111" stroke-width="4"/>
  <ellipse cx="250" cy="190" rx="75" ry="50" fill="#e9e9e9" stroke="#111" stroke-width="3"/>
  <ellipse cx="455" cy="180" rx="90" ry="62" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="150" y="88" font-family="sans-serif" font-size="32" fill="#111">A</text>
  <text x="235" y="198" font-family="sans-serif" font-size="30" fill="#111">B</text>
  <text x="465" y="188" font-family="sans-serif" font-size="30" fill="#111">C</text>
</svg>