<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
<title id="title">Aの補集合の数直線</title><desc id="desc">-1より小さい範囲と5より大きい範囲を示し、-1と5は含まない数直線。</desc>
<line x1="70" y1="110" x2="650" y2="110" stroke="#111" stroke-width="4"/>
<polygon points="70,110 88,100 88,120" fill="#111"/><polygon points="650,110 632,100 632,120" fill="#111"/>
<line x1="80" y1="110" x2="200" y2="110" stroke="#555" stroke-width="12" stroke-linecap="round"/>
<line x1="520" y1="110" x2="640" y2="110" stroke="#555" stroke-width="12" stroke-linecap="round"/>
<circle cx="210" cy="110" r="11" fill="#fff" stroke="#111" stroke-width="4"/>
<circle cx="510" cy="110" r="11" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="195" y="165" font-family="sans-serif" font-size="28" fill="#111">−1</text>
<text x="503" y="165" font-family="sans-serif" font-size="28" fill="#111">5</text>
</svg>