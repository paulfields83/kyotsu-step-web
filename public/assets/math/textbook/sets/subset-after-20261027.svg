<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">部分集合の関係</title>
  <desc id="desc">集合Bは集合Aの内部に完全に含まれる。一方、破線の集合CはAの外側にも広がる。</desc>
  <rect x="20" y="20" width="600" height="320" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <ellipse cx="290" cy="192" rx="190" ry="110" fill="none" stroke="#111" stroke-width="4"/>
  <ellipse cx="245" cy="189" rx="74" ry="46" fill="#e9e9e9" stroke="#111" stroke-width="3"/>
  <ellipse cx="454" cy="191" rx="85" ry="57" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="156" y="67" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="32" fill="#111">A</text>
  <text x="245" y="189" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="30" fill="#111">B</text>
  <text x="500" y="191" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="30" fill="#111">C</text>
</svg>